<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Shadowline — a top-down stealth game</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #05070c;
    min-height: 100%;
    font-family: sans-serif;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 16px;
    box-sizing: border-box;
  }
  canvas {
    display: block;
    max-width: 100%;
    height: auto;
    background: #0b0f16;
    border: 1px solid #1f2937;
    border-radius: 6px;
  }
  p {
    color: #6b7280;
    font-size: 13px;
    margin: 12px 0 0;
    text-align: center;
  }
</style>
</head>
<body>
<canvas id="game" width="880" height="680"></canvas>
<p>WASD / arrows to move &middot; hold Shift to sneak &middot; click to toss a pebble &middot; M to mute &middot; collect every chip, then reach the EXIT unseen.</p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
